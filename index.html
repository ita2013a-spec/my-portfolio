<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
	<link href="googleapis.com" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крючком и спицами. Вязаный декор ручной работы</title>
	<!-- Краткое описание сайта, которое люди увидят в результатах поиска Яндекса -->
    <meta name="description" content="Крючком и спицами. Уютный вязаный декор для дома из натурального хлопка и джута. Кашпо, авоськи, корзинки и одежда ручной работы на заказ.">
    <!-- Те самые ТЕГИ (ключевые слова), по которым вас должны находить -->
    <meta name="keywords" content="крючком и спицами, вязаный декор, кашпо из джута, авоська ручной работы, интерьерные корзины, вязание на заказ, декор хюгге">
	<link rel="icon" href="favicon.png" type="image/png">
	<style>
	
/* --- СТИЛИ ПО УМОЛЧАНИЮ (Для больших экранов компьютеров) --- */
        body { margin: 0; 
			display: flex; 
			height: 100vh; 
			font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", sans-serif; 
			overflow: hidden; 
			background-image: url('img/fon_body.jpg');
			/* 100% — строго по ширине страницы, auto — высота подстроится пропорционально */
			background-size: cover; 
			background-position: top center;
			background-attachment: fixed; /* Ткань застынет, а текст будет скользить поверх неё */
			background-repeat: no-repeat;
		}
		
        /* Левое узкое меню */
        nav { 
            width: 200px;
			height: 100vh;			
            background: url(img/down_bg.jpg) repeat;
			font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            color: white; 
            display: flex; 
            flex-direction: column; 
            padding: 20px;
            box-sizing: border-box;
			position: relative; /* Обязательно для позиционирования линии */
			overflow-y: auto; /* Если пункты не влезают по высоте, включается вертикальная прокрутка */
        }
		
		/* Создаем вертикальную линию из рисунка */
		nav:after {
			content: "";
			position: absolute;
			top: 0;
			right: 0;           /* Прижимаем к правому краю nav */
			width: 8px;        /* Ширина вашей линии */
			height: 100%;       /* На всю высоту меню */
			background-image: url('img/line_y.png');
			background-repeat: repeat-y; /* Повтор строго сверху вниз */
			background-size: contain;    /* Чтобы рисунок вписался в 15px по ширине */
		}
		
        nav a { 
            color: #1B365D;
            text-decoration: none; 
            margin: 10px 0; 
            font-weight: bold;
        }
		
        nav a:hover { color: white; }
			/* Основная область */
			.main-wrapper { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
        }
		
		/* Специальный класс для ссылок или заголовков в меню */
		.nav-blur-box {
			display: block;            /* Растягиваем на всю ширину меню */
			padding: 12px;
			margin: 10px 5px;
    
			/* Используем белый цвет, но всего на 15% прозрачности */
			background: linear-gradient(135deg, rgba(255,255,255,0.3) 0%, rgba(255,255,255,0.05) 100%);
    
			/* Глубокое размытие */
			backdrop-filter: blur(5px);
			-webkit-backdrop-filter: blur(5px);
    
			/* Белая полупрозрачная рамка добавит блеска краям */
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 10px;
    
			/* Мягкое свечение вместо черной тени */
			box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
		}
		
		.nav-blur-box:hover {
			background: rgba(0, 0, 0, 0.4); /* Затемнение при наведении */
		}
		
		.nav-blur-box.active {
			background: rgba(200, 240, 200, 0.6) !important; /* Ваш сочный зеленый с прозрачностью */
			border-left: 4px solid #0B2E13;              /* зеленая акцентная полоса слева */
			box-shadow: 0 4px 15px rgba(46, 125, 50, 0.3);
		}
		
		/* Меняем цвет ссылки внутри активной плашки */
		.nav-blur-box.active a {
			color: #094F2B !important; 
		}
		
        iframe { 
            flex: 1; 
            border: none; 
            width: 100%; 
        }
		
		#hr-line { /* узорна¤ горизонтальна¤ лини¤ */
			background: url(img/line.png) repeat-x;
			height: 10px;
		}
		
		.centered-img {
			display: block;    /* Превращаем в блок */
			border-radius: 20px;
			border: 5px solid rgba(255, 255, 255, 0.3); /* Стеклянный бортик */
			margin: 0 auto;    /* Автоматические отступы слева и справа центрируют её */
			object-fit: cover; /* Чтобы фактура не сплющилась при фиксированных размерах */
		}
		
		.footer-contacts {
			display: flex;
			justify-content: space-around; /* Распределяем контакты по всей ширине */
			align-items: center;
			padding: 15px 20px;
			background: rgba(255, 255, 255, 0.4); 
			backdrop-filter: blur(5px);
			border-top: 1px solid rgba(255, 255, 255, 0.2);
			margin-top: 0px;
			font-family: "Comic Sans MS", "Comic Sans", "Chalkboard SE", "Comic Neue", sans-serif;
			font-weight: bold;
		}
		
		.contact-item {
			text-align: center;
		}
		
		.contact-item span {
			display: block;
			font-size: 14px;
			text-transform: uppercase;
			letter-spacing: 1px;
			color: #1B365D; /* Темно-синий акцент */
			margin-bottom: 5px;
		}
		
		.contact-item a {
			color: #1a4b84;
			text-decoration: none;
			border-bottom: 1px dashed #1a4b84; /* Пунктирное подчеркивание выглядит стильно */
			transition: 0.3s;
		}
		
		.contact-item a:hover {
			color: #0B2E13; /* Зеленый при наведении*/
			border-bottom-color: #4CAF50;
		}
		
		/* --- СТИЛИ ДЛЯ КНОПОК УПРАВЛЕНИЯ (По умолчанию скрыты на компьютерах) --- */
		.mobile-menu-toggle, .mobile-menu-close {
			display: none; 
		}
		
		/* --- СТИЛИ ПО УМОЛЧАНИЮ (Для больших экранов компьютеров) --- */
		.contacts-header {
			display: flex;
			flex-direction: column;
			align-items: center;
			margin: 0;
			padding: 0;
			
		}

		.footer-arrow {
			display: none !important; /* Скрываем мобильные подсказки и стрелочку на ПК */
		}

		.main-phone-p {
			margin: 5px 0 0 0; /* Минимальный отступ между надписью и номером */
			padding: 0;
		}

		.main-phone-p a {
			color: #000080;
			text-decoration: none;
			font-weight: bold;
		}

		/* Контент с соцсетями и адресом на ПК виден ВСЕГДА и стоит в общем ряду */
		.contacts-hidden-content {
			display: flex;
			justify-content: space-around;
			align-items: center;
			gap: 60px; /* Расстояние между адресом и соцсетями на ПК */
		}


/* --- 📱 МАГИЯ ДЛЯ МОБИЛЬНЫХ ЭКРАНОВ (Меньше 768px) --- */
		@media (max-width: 768px) {
    
			/* Кнопка открытия меню в левом верхнем углу сайта */
			.mobile-menu-toggle {
				display: block; /* Показываем только на телефонах */
				position: fixed;
				top: 15px;
				left: 15px;
				z-index: 1500; /* Кнопка всегда поверх всего */
				background: rgba(26, 75, 132, 0.85); /* Ваш синий цвет с прозрачностью */
				backdrop-filter: blur(5px);
				color: white;
				border: 1px solid rgba(255, 255, 255, 0.2);
				padding: 10px 15px;
				border-radius: 20px;
				font-weight: bold;
				font-size: 14px;
				cursor: pointer;
				box-shadow: 0 4px 15px rgba(0,0,0,0.1);
			}

			/* Меню превращается в выезжающую шторку */
			nav {
				position: fixed !important;
				top: 0;
				left: -220px; /* Полностью прячем меню за левую границу экрана (200px ширина + 20px запас) */
				width: 200px;
				height: 100vh;
				
				/* 🛡️ ЗАЩИТА ОТ СЖАТИЯ (Новое!): */
				min-height: 100vh !important; 
				display: flex !important;
				flex-direction: column !important; 
				
				
				z-index: 2000; /* Меню выезжает поверх центрального контента */
				transition: left 0.4s ease-in-out; /* Эффект плавного скольжения */
				box-shadow: 5px 0 25px rgba(0, 0, 0, 0.3);
				
				/* 🎪 МАГИЯ ПРОКРУТКИ: */
				overflow-y: auto; /* Если пункты не влезают по высоте, включается вертикальная прокрутка */
				-webkit-overflow-scrolling: touch; /* Делает прокрутку пальцем на смартфонах очень плавной */
        
				/* Добавим небольшой отступ снизу, чтобы самый нижний пункт меню не прижимался к краю при прокрутке */
				padding-bottom: 30px !important; 
				box-sizing: border-box;
			}

			/* Класс, который JavaScript будет добавлять при клике для открытия */
			nav.open {
				left: 0; /* Меню плавно выезжает на экран */
			}

			/* Кнопка-крестик внутри выехавшего меню */
			.mobile-menu-close {
				display: block;
				align-self: flex-end; /* Сдвигаем в правый верхний угол меню */
				background: none;
				border: none;
				color: white;
				font-size: 35px;
				cursor: pointer;
				line-height: 1;
				margin-bottom: 10px;
			}

			/* Центральный контент теперь занимает 100% ширины телефона! */
			.main-wrapper {
				width: 100% !important;
				padding-top: 60px; /* Делаем отступ сверху, чтобы кнопка «☰ Меню» не перекрывала контент */
			}
		    
			.footer-contacts {
				position: fixed !important;
				bottom: 0;
				left: 0;
				width: 100%;
				z-index: 1400;
				flex-direction: column; /* На телефонах элементы встают друг под друга */
				justify-content: flex-start;
				background: rgba(255, 255, 255, 0.2) !important;
				backdrop-filter: blur(12px) !important;
				-webkit-backdrop-filter: blur(12px) !important;
				border-top: 1px solid rgba(255, 255, 255, 0.4);
				/* Жестко запираем высоту закрытой шторки */
				height: 45px !important; 
				max-height: 45px !important; 
				padding: 0 15px !important; 
				box-sizing: border-box;
				overflow: hidden;
				transition: max-height 0.4s ease-in-out, height 0.4s ease-in-out, background 0.3s;
			}

			/* Класс расширения, который будет добавлять JavaScript при клике */
			.footer-contacts.expanded {
				height: auto !important;
				max-height: 300px !important; 
				background: rgba(255, 255, 255, 0.35) !important;
				padding-bottom: 20px !important;
			}

			/* Оформляем верхнюю строчку на телефонах в один ряд */
			.contacts-header {
				flex-direction: row !important;
				justify-content: space-between !important;
				width: 100%;
				height: 45px !important; 
			}

			.mobile-tap-text {
				display: inline !important;
				font-size: 11px !important;
				color: #1b4d22; 
				font-weight: bold;
				text-transform: uppercase;
			}

			.main-phone-p {
				margin: 0 !important;
				line-height: 1 !important;
			}
	
			.main-phone-p a {
				font-size: 13px !important;
			}

			/* Показываем стрелочку-уголок */
			.footer-arrow {
				display: inline-block !important;
				color: #000080;
				font-size: 10px;
				transition: transform 0.4s;
			}

			/* При раскрытии шторки стрелочка переворачивается вниз */
			.footer-contacts.expanded .footer-arrow {
				transform: rotate(180deg);
			}

			/* Скрываемая часть с соцсетями и адресом */
			.contacts-hidden-content {
				margin-top: 15px;
				flex-direction: column;
				gap: 12px;
				width: 100%;
			}
		}
		
    </style>
</head>

<body>
	<!-- Кнопка «Бургер» для открытия меню на смартфонах -->
	<button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰ Меню</button>
    <nav  id="sidebar-menu">
		<!-- Кнопка-крестик для закрытия меню на смартфонах -->
		<button class="mobile-menu-close" onclick="toggleMobileMenu()">&times;</button>
		
		<!-- Передаем в функцию ID плашки, которую нужно подсветить -->
		<div class="nav-blur-box active" id="menu-main"> <!-- Задаем active первой по умолчанию -->
			<a href="main_str.html" target="content-frame" onclick="highlightMenu('menu-main')">Главная страница. Обо мне</a>
		</div>
		<div class="nav-blur-box" id="menu-gallery">
			<a href="gallery.html" target="content-frame" onclick="highlightMenu('menu-gallery')">Галерея работ и ценник</a>
		</div>
		<div class="nav-blur-box" id="menu-services">
			<a href="services.html" target="content-frame" onclick="highlightMenu('menu-services')">Услуги и рекомендации</a>
		</div>		
		<div class="nav-blur-box" id="menu-contacts">
			<a href="contacts.html" target="content-frame" onclick="highlightMenu('menu-contacts')">Контакты</a>
		</div>		
		<div class="nav-blur-box" id="menu-stories">
			<a href="stories.html" target="content-frame" onclick="highlightMenu('menu-stories')">Вязальные байки</a>
		</div>
    </nav>

    <div class="main-wrapper">
        <!-- Сюда грузятся страницы -->
        <iframe name="content-frame" src="main_str.html"></iframe>
		<!-- низ страницы с контактами -->
		<div class="footer-contacts" id="footer-contacts">
		
			<!-- 📞 Эта строчка на телефонах будет аккуратной кнопкой, а на ПК — обычным заголовком -->
			<div class="contacts-header" onclick="toggleFooterContacts()">
				<span class="mobile-tap-text">📞 Телефон для связи:</span>
				<p class="main-phone-p">
					<a href="tel:+79286144211" onclick="event.stopPropagation();">+7 (928) 614-42-11</a>
				</p>
				<span class="footer-arrow">▲</span>
			</div>
        
			<!-- 📦 Блок с адресом и соцсетями, который прячется на смартфонах -->
			<div class="contacts-hidden-content">
				<div class="contact-item">
					<span>📍 Мастерская:</span>
					<p style="color: #1B365D;">г. Ростов-на-Дону</p>
				</div>
				<div class="contact-item">
					<span>✉️ Соцсети и мессенджеры<br>привязаны к номеру телефона:</span>
					<div class="social-links">
						<a href="https://t.me" target="_blank">Telegram</a>
						<a href="https://wa.me" target="_blank">WhatsApp</a>
					</div>
				</div>
		
			</div>
		</div>
	</div>

<script>
function highlightMenu(activeId) {
    const allBoxes = document.querySelectorAll('.nav-blur-box');
    allBoxes.forEach(box => box.classList.remove('active'));

    const activeBox = document.getElementById(activeId);
    if (activeBox) activeBox.classList.add('active');
}

// Универсальный отслеживатель для Яндекс и Гугл браузеров
const iframe = document.querySelector('iframe[name="content-frame"]');

if (iframe) {
    // Каждые 300 миллисекунд главное окно само проверяет, что открыто во фрейме
    setInterval(function() {
        try {
            // Берем имя файла из свойства src фрейма (это безопасно и разрешено везде)
            const currentSrc = iframe.src || '';
            
            // Если в процессе кликов фрейм поменял адрес, мы это увидим
            const iframeWindow = iframe.contentWindow;
            if (iframeWindow && iframeWindow.location) {
                const path = iframeWindow.location.pathname;
                const pageName = path.substring(path.lastIndexOf('/') + 1);
                
                // Проверяем имя файла и переключаем подсветку
                if (pageName === 'main_str.html' || pageName === '') {
                    highlightMenu('menu-main');
                } else if (pageName === 'gallery.html') {
                    highlightMenu('menu-gallery');
                } else if (pageName === 'services.html') {
                    highlightMenu('menu-services');
                } else if (pageName === 'contacts.html') {
                    highlightMenu('menu-contacts');
                } else if (pageName === 'stories.html') {
                    highlightMenu('menu-stories');
                }
				
            }
        } catch (e) {
            // Если Яндекс.Браузер блокирует чтение pathname, этот блок перехватит ошибку,
            // но сайт продолжит работать, а ручные клики по меню всё равно будут подсвечиваться.
        }
    }, 300);
}

function toggleMobileMenu() {
    const menu = document.getElementById('sidebar-menu');
    // Метод toggle автоматически добавляет класс "open", если его нет, и удаляет, если он есть
    menu.classList.toggle('open');
}

/* Фикс: когда пользователь выбирает пункт в меню, шторка должна автоматически закрыться */
document.querySelectorAll('nav a').forEach(link => {
    link.addEventListener('click', () => {
        const menu = document.getElementById('sidebar-menu');
        menu.classList.remove('open');
    });
});

function toggleFooterContacts() {
    const footer = document.getElementById('footer-contacts');
    // Тоггл плавно добавляет или убирает класс, который меняет высоту
    footer.classList.toggle('expanded');
}
</script>

</body>
</html>
