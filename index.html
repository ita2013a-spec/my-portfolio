	/* Создаем вертикальную линию из рисунка */

	/* Специальный класс для ссылок или заголовков в меню */

	.nav-blur-box:hover {

	.nav-blur-box.active {

	/* Меняем цвет ссылки внутри активной плашки */

			position: fixed !important;
			top: 0;
			left: -220px; /* Полностью прячем меню за левую границу экрана (200px ширина + 20px запас) */

			height: 100vh;
			/* 🛡️ ЗАЩИТА ОТ СЖАТИЯ (Новое!): */

			display: flex !important;
			flex-direction: column !important; 
			z-index: 2000; /* Меню выезжает поверх центрального контента */
			transition: left 0.4s ease-in-out; /* Эффект плавного скольжения */
			box-shadow: 5px 0 25px rgba(0, 0, 0, 0.3);
			/* 🎪 МАГИЯ ПРОКРУТКИ: */
			overflow-y: auto; /* Если пункты не влезают по высоте, включается вертикальная прокрутка */
			-webkit-overflow-scrolling: touch; /* Делает прокрутку пальцем на смартфонах очень плавной */  
			/* Добавим небольшой отступ снизу, чтобы самый нижний пункт меню не прижимался к краю при прокрутке */
			padding-bottom: 30px !important; 
			box-sizing: border-box;
		}

		/* Класс, который JavaScript будет добавлять при клике для открытия */
		nav.open {
			left: 0; /* Меню плавно выезжает на экран */
		}

		/* Кнопка-крестик внутри выехавшего меню */
		.mobile-menu-close {
			display: block;
			align-self: flex-end; /* Сдвигаем в правый верхний угол меню */

			cursor: pointer;
			line-height: 1;
			margin-bottom: 10px;

	}
		
/* Контейнер подвала зафиксирован внизу */
    .bottom-bar {
		position: fixed;
		bottom: 0;
		left: 0;
		width: 100%;
		padding: 5px 0;
		text-align: center;
		cursor: pointer;
		overflow: hidden; /* Скрывает края картинки, если они выходят за рамки */
		/* Начальное состояние: полупрозрачный фон с размытием */
		background-color: rgba(255, 255, 255, 0.2); 
		backdrop-filter: blur(15px);
		-webkit-backdrop-filter: blur(15px); /* Поддержка для Safari */
		color: #1B365D;
		font-weight: 600;
		/* Аккуратная рамка и тень */
		border-top: 1px solid rgba(11, 70, 50, 0.15);
		box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.05);
		/* Плавный переход для подъема панели */
		transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.4s ease;
		transform: translateY(0);
    }

	/* Псевдоэлемент, который хранит скрытую картинку фоном */
	.bottom-bar::before {
		content: "";
		position: absolute;
		top: 0;
		left: 0;
		width: 100%;
		height: 100%;
		z-index: -1; /* Картинка уходит под текст */
		/* Настройки вашей картинки */
		background-image: url('img/top_bg.jpg');
		background-position: bottom center;
		background-size: 20%;
		background-repeat: repeat;
		/* По умолчанию картинка полностью прозрачна */
		opacity: 0;
		/* Плавное проявление картинки за 0.4 секунды */
		transition: opacity 0.4s ease-in-out; 
	}
	
	/* --- СОСТОЯНИЕ ПРИ НАЖАТИИ (ФОКУСЕ) --- */
	/* Приподнимаем плашку и усиливаем тень */
	.bottom-bar.is-open {
		transform: translateY(-10px);
		box-shadow: 0 -5px 25px rgba(11, 70, 50, 0.2);
	}

	/* Делаем фоновую картинку видимой при нажатии */
	.bottom-bar.is-open::before {
		opacity: 1;
	}

	/* Оставляем стили для ссылок внутри */
	.extra-info a {
		color: #1B365D; 
		text-decoration: none;
		border-bottom: 1px dashed #0b4632;
		transition: opacity 0.2s ease;
	}

	.extra-info a:hover {
		opacity: 0.8;
		border-bottom-style: solid;
	}

	.phone-info {
		font-size: 19px;
		font-weight: 700;
	}

    /* Внутренний контейнер для элементов */
    .bottom-bar__content {
		display: flex;
		justify-content: center;
		align-items: center;
		gap: 30px;
		max-width: 1200px;
		margin: 0 auto;
		padding: 0 20px;
	}

    /* Скрываем адрес и соцсети по умолчанию */
    .extra-info {
		opacity: 0;
		visibility: hidden;
		max-width: 0;
		white-space: nowrap;
		transition: all 0.3s ease-in-out;
    }

    /* --- МАГИЯ АНИМАЦИИ ПРИ НАЖАТИИ (ФОКУСЕ) --- */
    /* Приподнимаем панель, меняем фон */
    .bottom-bar.is-open {
		transform: translateY(-10px);
		background-color: #111;
	}

    /* Показываем скрытые элементы при нажатии */
    .bottom-bar.is-open .extra-info {
		opacity: 1;
		visibility: visible;
		max-width: 400px; /* Ограничиваем ширину для корректной анимации */
    }

	/* Контейнер для телефона и стрелочки */
	.phone-container {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		gap: 8px; /* Расстояние между телефоном и стрелочкой */
		position: relative;
	}

	/* Создаем стрелочку с помощью псевдоэлемента ::after */
	.phone-container::after {
		content: "▲"; /* Символ треугольной стрелочки вверх */
		font-size: 20px;
		color: #1B365D; /* Тот же темно-зеленый цвет */
		/* Плавный поворот стрелочки за 0.4 секунды */
		transition: transform 0.4s ease-in-out, opacity 0.3s ease;
		transform: rotate(0deg); /* Начальное положение — смотрит вверх */
		display: inline-block;
	}

	/* --- МАГИЯ ПОВОРОТА ПРИ НАЖАТИИ --- */
	/* Когда нажимают на подвал, стрелочка внутри phone-container плавно переворачивается */
	.bottom-bar.is-open .phone-container::after {
		transform: rotate(180deg); /* Разворачиваем стрелочку вниз */
		color: #1B365D; /* Можно изменить цвет активной стрелки, если захочется */
	}

    /* --- МОБИЛЬНАЯ ВЕРСИЯ (Адаптив нижней части под 3 строчки) --- */
		@media (max-width: 768px) {
			.bottom-bar__content {
				flex-direction: column; /* Выстраиваем в стек (3 строчки) */
				gap: 5px;
			}

			/* Изменяем анимацию раскрытия для мобильных (по вертикали) */
			.bottom-bar.is-open .extra-info {
				max-height: 100px; 
			}

			.extra-info {
				max-width: none;
				max-height: 0;
				overflow: hidden;
			}
    	
			/* Опционально: на мобильных экранах делаем стрелочку чуть заметнее */
			.phone-container::after {
				font-size: 14px;
			}
		}	
    </style>
</head>

<body>

<script>
function highlightMenu(activeId) {
    const allBoxes = document.querySelectorAll('.nav-blur-box');
    allBoxes.forEach(box => box.classList.remove('active'));

    const activeBox = document.getElementById(activeId);
    if (activeBox) activeBox.classList.add('active');
}

// Универсальный отслеживатель для Яндекс и Гугл браузеров
const iframe = document.querySelector('iframe[name="content-frame"]');

if (iframe) {
    // Каждые 300 миллисекунд главное окно само проверяет, что открыто во фрейме
    setInterval(function() {
        try {
            // Берем имя файла из свойства src фрейма (это безопасно и разрешено везде)
            const currentSrc = iframe.src || '';
            
            // Если в процессе кликов фрейм поменял адрес, мы это увидим
            const iframeWindow = iframe.contentWindow;
            if (iframeWindow && iframeWindow.location) {
                const path = iframeWindow.location.pathname;
                const pageName = path.substring(path.lastIndexOf('/') + 1);
                
                // Проверяем имя файла и переключаем подсветку
                if (pageName === 'main_str.html' || pageName === '') {
                    highlightMenu('menu-main');
                } else if (pageName === 'gallery.html') {
                    highlightMenu('menu-gallery');
                } else if (pageName === 'services.html') {
                    highlightMenu('menu-services');
                } else if (pageName === 'contacts.html') {
                    highlightMenu('menu-contacts');
                } else if (pageName === 'stories.html') {
                    highlightMenu('menu-stories');
                }
				
            }
        } catch (e) {
            // Если Яндекс.Браузер блокирует чтение pathname, этот блок перехватит ошибку,
            // но сайт продолжит работать, а ручные клики по меню всё равно будут подсвечиваться.
        }
    }, 300);
}

function toggleMobileMenu() {
    const menu = document.getElementById('sidebar-menu');
    // Метод toggle автоматически добавляет класс "open", если его нет, и удаляет, если он есть
    menu.classList.toggle('open');
}

/* Фикс: когда пользователь выбирает пункт в меню, шторка должна автоматически закрыться */
document.querySelectorAll('nav a').forEach(link => {
    link.addEventListener('click', () => {
        const menu = document.getElementById('sidebar-menu');
        menu.classList.remove('open');
    });
});

/* стрелочка в нижнем меню */
const bottomBar = document.querySelector('.bottom-bar');

  bottomBar.addEventListener('click', function(event) {
    // Переключаем класс opens/closes при каждом клике
    this.classList.toggle('is-open');
  });

  // Дополнительно: закрывать панель, если кликнули в любое другое место сайта
  document.addEventListener('click', function(event) {
    if (!bottomBar.contains(event.target)) {
      bottomBar.classList.remove('is-open');
    }
  });
  
</script>
